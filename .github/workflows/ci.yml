name: Web CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: tradestrix-web

jobs:
  quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradestrix-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tradestrix-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/'))
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/'))
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Docker tag
        id: docker-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Format: v1.0.0
            TAG="${{ github.ref_name }}"
          else
            # Format: tradestrix-web_<branch>_YYYYMMDD_HHMMSS (IST)
            BRANCH="${{ github.ref_name }}"
            BRANCH_SANITIZED="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#-+#-#g; s#^-+##; s#-+$##')"
            BRANCH_SANITIZED="${BRANCH_SANITIZED:0:40}"
            if [[ -z "$BRANCH_SANITIZED" ]]; then
              BRANCH_SANITIZED="branch"
            fi
            TAG="tradestrix-web_${BRANCH_SANITIZED}_$(TZ=Asia/Kolkata date +%Y%m%d_%H%M%S)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry != '' && format('{0}/{1}', steps.login-ecr.outputs.registry, env.ECR_REPOSITORY) || env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.tag }}

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: tradestrix-web
          file: tradestrix-web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_BACKEND_BASE_URL=${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/')) }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker build summary
        if: always()
        env:
          IMAGE_REPO: ${{ steps.login-ecr.outputs.registry != '' && format('{0}/{1}', steps.login-ecr.outputs.registry, env.ECR_REPOSITORY) || env.ECR_REPOSITORY }}
          PUSHED_TO_ECR: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          {
            echo "## Web Docker image"
            echo ""
            echo "- Docker image: ${IMAGE_REPO}:${{ steps.docker-tag.outputs.tag }}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
            echo "- Pushed to ECR: ${PUSHED_TO_ECR}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
